defaults:
  - override hydra/job_logging: custom
  - _self_

hydra:
  run:
    dir: ./outputs/${experiment_name}/${run_id}
  job_logging:
    handlers:
      file:
        filename: ${hydra.run.dir}/log.log

# Famous-quotes ACR on Llama-2-13B BASE (meta-llama/Llama-2-13b-hf) -- the
# pretrained base model, NOT -chat. No chat template (base model): prep_text
# places the optimized free tokens directly before the target. Same protocol as
# the Pythia-12B config; different (stronger) base model.
# Note: gated on HF (Llama-2 license). Works with the repo's pinned transformers.
model_name: meta-llama/Llama-2-13b-hf
dataset: famous_quotes
data_idx: 52           # 52 = "You miss 100% of the shots you don't take." (Gretzky)

chat_template:
  - ""
  - ""
system_prompt: ""
input_str: ""

discrete_optimizer: gcg
b: 0.9                  # probabilistic success threshold: P(target|prompt) >= b**T (CLI/B-env overridable)
batch_size: 100
mini_batch_size: 100
num_steps: 200
topk: 250
lr: 0.01
optimizer: adam
max_tokens: -1

random_weights: false
seed: 42
target_str: jumps over the lazy dog   # ignored when dataset+data_idx are set
experiment_name: ${model_name}_${discrete_optimizer}_${lr}_${batch_size}_${num_steps}_${topk}_${seed}
run_id: ${generate_id:}
